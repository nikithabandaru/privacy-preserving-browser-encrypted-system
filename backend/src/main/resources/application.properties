spring.application.name=backend
server.port=8080

# File Upload settings
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Local storage path (used temporarily for OCR processing before encryption)
dams.storage.local-dir=uploads



# Firebase (Auth + Firestore only — files stored in MongoDB)
firebase.storage.bucket=ai-digital-9a2fe.firebasestorage.app

# MongoDB Atlas — GridFS for encrypted file storage (images, videos, documents)
spring.profiles.include=secret
spring.data.mongodb.database=dams

